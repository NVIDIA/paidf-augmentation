include:
  - component: $CI_SERVER_FQDN/security/devops-tools/ci-cd-components/sonarqube/sonarqube-scan@2.0.1
    inputs:
      stage: security
      nspect_id: NSPECT-OS84-33VF
      sonar_project_key: "TEGRASW_Metropolis-perf_SDG_augmentation"
      sonar_project_name: "TEGRASW_Metropolis-perf_SDG_augmentation"
      sonar_project_version: "${CI_COMMIT_SHORT_SHA}"
      sonar_source_code_language: python
      allow_failure: true
      vault_role: ""
      rules:
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        - if: $CI_COMMIT_BRANCH == 'main'
        - if: $CI_COMMIT_BRANCH == 'master'
        - if: $CI_COMMIT_BRANCH == 'develop'

  - project: nvcarps/ci-group/nvcarps-ci
    ref: main
    file: /.gitlab/nvcarps-upstream-ci.yml

workflow:
  rules:
    # See https://docs.gitlab.com/ci/yaml/workflow/#skip-pipelines-for-draft-merge-requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

stages:
  - lint
  - test
  - build
  - security
  - nvcarps
  - nvskills-pipeline

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  # CI dev image destination. DEV_REGISTRY_BASE is defined as a
  # project-level CI/CD variable so the NGC org/team are not hardcoded
  # in the repo. Promotion from this internal location to the external
  # PAI-data-factory/paidf-dev org is handled by the artifacts-promotion
  # pipeline.
  DEV_IMAGE: "${DEV_REGISTRY_BASE}/paidf-augmentation"
  # nvcarps upstream CI — external profile, for parity with the GitHub-based nvcarps
  NVCARPS_CI_TRIGGER_BRANCH: "main"
  NVCARPS_CI_UPSTREAM_PROFILE: "external"
  NVCARPS_CI_AUTO_SIGN: "true"

# ---------------------------------------------------------------------------
#`.python-version`. astral's `uv:<ver>-python3.13-...` only
# ships uv 0.9.x for 3.13, which doesn't recognize the 3.13.13 prebuilt as a managed
# install — so we install uv from PyPI pinned to the production Dockerfile's version.
# ---------------------------------------------------------------------------
.python-setup:
  image: python:3.13.13-slim
  before_script:
    - pip install --no-cache --quiet uv==0.11.10
    - rm -rf .venv
    - uv venv
    - uv sync --only-dev

ruff-format:
  extends: .python-setup
  stage: lint
  script:
    - uv run ruff format

ruff-check:
  extends: .python-setup
  stage: lint
  script:
    - uv run ruff check

unit-test:
  extends: .python-setup
  stage: test
  script:
    - uv sync --all-extras
    - uv run pytest --cov --cov-report=term --cov-report=xml:coverage_report.xml --junitxml=test_report.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - test_report.xml
      - coverage_report.xml
    reports:
      junit: test_report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage_report.xml

# Shared template for docker build jobs
.docker-build-template:
  stage: build
  image: docker:28.4.0
  services:
    - docker:28.4.0-dind
  before_script:
    - docker --version
    - echo "$METRO_PERF_NGC_API_KEY" | docker login nvcr.io -u "\$oauthtoken" --password-stdin
  after_script:
    - docker image prune -f || true

# Slim image build - runs on most changes (no local cosmos executor)
build-publish-container-slim:
  extends: .docker-build-template
  interruptible: true
  script:
    - |
      if [ -z "$METRO_PERF_NGC_API_KEY" ]; then
        echo "Error: METRO_PERF_NGC_API_KEY environment variable is not set"
        exit 1
      fi

      VERSION=$(awk -F' *= *' '/^version *=/ {gsub(/"/, "", $2); print $2; exit}' pyproject.toml)
      if [ -z "$VERSION" ]; then
        echo "Error: Could not extract version from pyproject.toml"
        exit 1
      fi

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        LABEL="mr$CI_MERGE_REQUEST_IID"
      else
        LABEL="main"
      fi

      IMAGE_TAG="$VERSION-$CI_COMMIT_SHORT_SHA.$LABEL-slim"

      docker pull $DEV_IMAGE:cache || true
      docker build \
        --cache-from $DEV_IMAGE:cache \
        -t $DEV_IMAGE:$IMAGE_TAG \
        -t $DEV_IMAGE:cache \
        -f docker/Dockerfile .

      docker push $DEV_IMAGE:$IMAGE_TAG
      docker push $DEV_IMAGE:cache
      echo "Image pushed to $DEV_IMAGE:$IMAGE_TAG"

      docker rmi $DEV_IMAGE:$IMAGE_TAG

# Full image build - only runs when Dockerfile or local executor changes (or manually triggered)
build-publish-container-full:
  extends: .docker-build-template
  rules:
    # Always auto-run on main so every merge produces a full image
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    # Auto-run on MRs only when Docker/executor files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/Dockerfile
        - modules/generation/cosmos/local_executor.py
      when: on_success
    # Allow manual trigger on MRs at any time
    - when: manual
      allow_failure: true
  interruptible: true
  script:
    - |-
      if [ -z "$METRO_PERF_NGC_API_KEY" ]; then
        echo "Error: METRO_PERF_NGC_API_KEY environment variable is not set"
        exit 1
      fi

      VERSION=$(awk -F' *= *' '/^version *=/ {gsub(/"/, "", $2); print $2; exit}' pyproject.toml)
      if [ -z "$VERSION" ]; then
        echo "Error: Could not extract version from pyproject.toml"
        exit 1
      fi

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        LABEL="mr$CI_MERGE_REQUEST_IID"
      else
        LABEL="main"
      fi

      IMAGE_TAG="$VERSION-$CI_COMMIT_SHORT_SHA.$LABEL"
      docker build -t $DEV_IMAGE:$IMAGE_TAG -f docker/Dockerfile .
      docker push $DEV_IMAGE:$IMAGE_TAG
      echo "Image pushed to $DEV_IMAGE:$IMAGE_TAG"

      docker rmi $DEV_IMAGE:$IMAGE_TAG || true
