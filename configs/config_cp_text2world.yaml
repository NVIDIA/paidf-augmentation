data:
  - inputs: null
    output:
      video: "data/cp_text2world_output.mp4"
      caption: "data/cp_text2world_prompt.txt"
      metadata: "data/cp_text2world_metadata.json"

endpoints:
  vlm:
    url: "http://localhost:8000/v1"
    model: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  llm:
    url: "http://localhost:8001/v1"
    model: "Qwen/Qwen2.5-14B-Instruct"

captioning:
  llm:
    system_prompt: |
      You are an expert at writing prompts for a surveillance video generation model.
      You will be given attribute-value pairs describing:
      1. The environment (location, lighting, time of day, camera perspective).
      2. The action or event to depict.
      3. The subject(s) involved.
      Your task:
      - Write a prompt with two paragraphs.
      - First paragraph: describe the scene setting — camera angle, location,
        lighting, and atmosphere. Emphasize that the camera is far away and the
        subjects appear small in the frame (surveillance perspective).
      - Second paragraph: describe the subject(s) and the action/event. Keep the
        action description concise (1-3 sentences). The model follows simple
        prompts much better than complex ones.
      - IMPORTANT: The camera viewpoint must remain completely static and fixed
        throughout the entire video. Do not describe any camera movement, panning,
        zooming, or angle changes. The scene is captured from a single, stationary
        camera position.
      - IMPORTANT: The camera is the implicit observer — never name a camera,
        CCTV, lens, or recording device as a visible object in the prompt. Describe
        the camera perspective as a viewpoint only (e.g., "an elevated wide view from
        rooftop height"), never as an in-scene object (e.g., "from a
        rooftop-mounted camera").
      Output only a JSON object with a single key "prompt" containing the full text.
    example_prompt: |
      A wide elevated view looking down from rooftop height over a warehouse
      perimeter at night. A tall figure in dark jeans and a grey hoodie approaches
      a chain-link fence, grabs the top bar, and pulls themselves over in a single
      motion. Dim amber streetlights cast long shadows across the gravel lot. The
      person appears very small in the frame, viewed from a long distance.
    parameters:
      temperature: 0.5
      top_p: 0.95
      max_tokens: 1024
      frequency_penalty: 1.05
      presence_penalty: 0
      stream: true

    variables:
      # Environment
      location: [
        "warehouse perimeter with chain-link fence and gravel lot",
        "brightly lit retail store aisle with product shelves",
        "dimly lit parking garage level 2 with concrete pillars",
        "electronics store with display shelves and aisles",
        "office lobby with reception desk and seating area",
        "outdoor parking lot with parked vehicles",
        "subway platform with tiled walls and benches",
        "hospital corridor with white walls and equipment carts",
        "hotel lobby with marble floor and front desk",
        "construction site with scaffolding and equipment",
      ]
      lighting: [
        "dim amber streetlights casting long shadows",
        "bright fluorescent ceiling lights illuminating evenly",
        "flickering overhead fluorescent tubes casting harsh white light",
        "bright store lighting illuminating aisles",
        "warm overhead lighting filling the space",
        "dim emergency lighting with red exit signs",
        "natural daylight through large windows",
        "harsh sodium vapor lamps casting orange tint",
      ]
      time_of_day: ["night", "daytime", "dusk", "early morning", "late afternoon"]
      camera_perspective: [
        "wide elevated view looking down from rooftop height",
        "distant overhead view from ceiling height",
        "far-away wide-angle view from wall height",
        "wide shot from a high corner viewpoint",
        "elevated wide-angle view from pole height",
      ]

      # Action / Event
      action_type: [
        "climbing over a fence or barrier",
        "slipping and falling on a wet or uneven surface",
        "two people shoving and fighting each other",
        "a person concealing an item and walking toward the exit",
        "two people greeting each other with a hug (normal behavior)",
        "a person running through the scene at full speed",
        "a person loitering and pacing back and forth",
        "a person forcing open a door or gate",
        "a person collapsing to the ground",
        "two people having a calm conversation (normal behavior)",
      ]
      subject_appearance: [
        "a tall figure in dark jeans and a grey hoodie",
        "a woman in a red coat and white sneakers",
        "two men in work uniforms — one stocky in a blue polo, one lean in a black t-shirt",
        "a young man in an oversized olive jacket",
        "two coworkers — a woman in a grey blazer and a man in a blue dress shirt",
        "a person in a high-visibility yellow vest and hard hat",
        "a teenager in a black backpack and white sneakers",
        "an elderly person in a brown coat with a walking cane",
      ]

    # Verification options — condensed MCQ choices for attribute verification.
    # Each variable maps to a list of plausible answer choices (including the
    # correct value). The LLM question generator uses these to build MCQs.
    verification_options:
      location: [
        "warehouse or industrial area",
        "retail store or electronics shop",
        "parking garage",
        "office or lobby area",
        "outdoor parking lot",
        "subway or transit platform",
        "hospital or medical facility",
        "construction site",
      ]
      lighting: [
        "dim or low ambient light",
        "bright fluorescent or ceiling lights",
        "flickering or harsh white light",
        "warm or natural daylight",
        "sodium vapor or orange-tinted light",
      ]
      time_of_day: ["night", "daytime", "dusk", "early morning", "late afternoon"]
      action_type: [
        "climbing or jumping over a barrier",
        "slipping and falling",
        "two people fighting or shoving",
        "concealing an item and walking away",
        "two people greeting each other (normal behavior)",
        "running through the scene",
        "loitering or pacing",
        "forcing open a door or gate",
        "collapsing to the ground",
        "two people having a calm conversation (normal behavior)",
      ]
      subject_appearance: [
        "a person in dark clothing (jeans, hoodie)",
        "a person in a bright or distinctive coat",
        "two people in work uniforms",
        "a person in an oversized jacket",
        "a person in business/office attire",
        "a person in high-visibility safety gear",
        "a young person with a backpack",
        "an elderly person with a walking aid",
      ]

augmentation:
  model:
    name: "cosmos-predict"
    version: "2B"
    executor_type: "local"

  parameters:
    inference_type: "text2world"
    num_output_frames: 93
    num_steps: 35
    enable_autoregressive: true
    chunk_size: 93
    chunk_overlap: 2
    seed: 42
    guidance: 3
    resolution: "none"
    inference_name: "cp_text2world"

  local_parameters:
    num_processes: 4
    master_port: 12341

evaluators:
  - attribute_verification:
      enabled: true
      extra_questions:
        - variable: "surveillance_perspective"
          question: "Is the video captured from a fixed, static surveillance camera viewpoint (no camera movement, panning, or zooming)?"
          options:
            A: "Yes, the camera is completely static throughout"
            B: "The camera is mostly static with slight movement"
            C: "No, the camera clearly moves, pans, or zooms"
          correct_answer: "A"
          request_reasoning: true

        - variable: "person_visibility"
          question: "Is at least one person visible in the scene?"
          options:
            A: "Yes, one or more people are clearly visible"
            B: "There may be a person but they are too small or blurry to confirm"
            C: "No, the scene is empty of people"
          correct_answer: "A"
          request_reasoning: true

        - variable: "scene_realism"
          question: "Does the video look like realistic surveillance or security camera footage?"
          options:
            A: "Yes, it resembles real surveillance footage"
            B: "It looks somewhat realistic but has noticeable artifacts"
            C: "No, it looks clearly artificial or cartoon-like"
          correct_answer: "A"
          request_reasoning: true

      question_generation:
        system_prompt: |
          You are an expert at creating multiple choice verification questions
          for surveillance video content. Your task is to generate a simple,
          direct question that can verify a specific visual attribute in a video
          frame. The question must have 2-4 answer options and test for a specific
          visual attribute. The question should be answerable by looking at a
          single frame from the video.
          Output your response as a single JSON object with no additional text or formatting.
        parameters:
          retry: 1
          temperature: 0.2
          top_p: 0.95
          frequency_penalty: 0.0
          presence_penalty: 0.0
          max_tokens: 2048
          stream: true
      vlm_verification:
        system_prompt: |
          You are an expert vision model tasked with answering multiple choice
          questions about surveillance video frames. Analyze the image carefully
          and select the single best answer from the provided options. Respond
          with ONLY a single letter (A, B, C, or D) corresponding to your answer.
          Do not include any explanation or additional text.
        parameters:
          retry: 0
          temperature: 0.0
          top_p: 1.0
          frequency_penalty: 0.0
          max_tokens: 10
          stream: false
