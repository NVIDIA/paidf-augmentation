# Cosmos Transfer 2.5 — VLM+LLM captioning (Isaac Sim warehouse scenes)

data:
  - inputs:
      rgb: "/app/data/rgb.mp4"
      controls:
        edge: null
        depth: null
        seg: null
        vis: null
    output:
      video: "/app/data/output.mp4"
      caption: "/app/data/isaacsim_prompt.txt"
      metadata: "/app/data/isaacsim_metadata.json"

endpoints:
  vlm:
    url: "http://localhost:8000/v1"
    model: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  llm:
    url: "http://localhost:8001/v1"
    model: "Qwen/Qwen2.5-14B-Instruct"

pipeline:
  retry: 3
  regenerate_caption_on_retry: true
  logging:
    enabled: true
    level: "INFO"

captioning:
  vlm:
    parser: "instruct"
    system_prompt: |
      You are a helpful assistant. Respond with plain descriptive text only.
    user_prompt: >
      Analyze the warehouse CCTV footage and generate a detailed description of the
      visual elements in the scene. Focus on the physical environment (e.g., warehouse
      layout, shelves, floor, equipment, walls, etc.), the objects (such as boxes,
      forklifts, workers), and the events (e.g., boxes falling, workers positions,
      gestures, reactions, forklift moving). Use objective, neutral language — do not
      invent a story or speculate about causes or intentions.
    parameters:
      temperature: 0.6
      top_p: 0.95
      frequency_penalty: 1.05
      max_tokens: 4096
      stream: false

  llm:
    system_prompt: |
      You are an expert at writing concise prompts for a video generation model.
      You are given:
      1. A caption describing the source warehouse scene.
      2. Attribute-value pairs describing desired visual changes.
      Generate a single natural-language prompt that applies the target attributes
      while preserving the original scene layout and object positions.
      Output only a JSON object with a single key "prompt" containing the final sentence.
    parameters:
      temperature: 0.3
      top_p: 0.95
      max_tokens: 512
      frequency_penalty: 1.05
      presence_penalty: 0
      stream: true

    variables:
      warehouse_wall_color: ["gray", "white", "red", "blue", "beige", "light gray", "off-white"]
      warehouse_floor_color: ["gray", "light gray", "concrete", "white", "beige", "brown", "epoxy", "green (painted)", "yellow (safety marking)", "polished", "bare concrete"]
      warehouse_box_material: ["cardboard", "plastic", "wood", "metal"]
      warehouse_shadow_intensity: ["none", "light", "medium", "strong", "heavy"]
      worker_clothing_color: ["gray", "white", "blue", "yellow", "orange", "black", "navy", "high-visibility green", "brown"]
      forklift_color: ["yellow", "orange", "red", "blue", "green", "gray", "black", "white"]

augmentation:
  model:
    name: "cosmos-transfer2.5"
    version: "ct2.5"
    executor_type: "local"

  parameters:
    sigma: 90
    seed: null
    guidance: 3
    num_steps: 35
    inference_name: "cosmos_transfer_inference"
  local_parameters:
    num_processes: 4    # number of GPUs
  modalities:
    edge: 1.0
    vis: 0.05
    positive_prompt: |
      cinematic, photorealistic, ultra high quality, ultra high resolution,
      high fidelity, high definition, realistic warehouse scene with proper
      physics and coherent motion
    negative_prompt: |
      The video captures a game playing, with bad crappy graphics and cartoonish
      frames. It represents a recording of old outdated games. The lighting looks
      very fake. The textures are very raw and basic. The geometries are very
      primitive. The images are very pixelated and of poor CG quality. There are
      many subtitles in the footage. Overall, the video is unrealistic at all.

evaluators:
  - hallucination_check:
      enabled: true
      threshold: 0.682
      params:
        grad_thresh: 10.0
        blur_ksize: 7
        morph_k: 3
        dist_tol_px: 7.0
        max_frames: null
  - attribute_verification:
      enabled: true
      question_generation:
        system_prompt: |
          You are an expert at creating multiple choice verification questions.
          Your task is to generate a simple, direct question that can verify a
          specific attribute in a video frame. The question must have 2-4 answer
          options and test for a specific visual attribute. The question should be
          answerable by looking at a single frame from the video.
          Output your response as a single JSON object with no additional text or formatting.
        parameters:
          retry: 1
          temperature: 0.2
          top_p: 0.95
          frequency_penalty: 0.0
          presence_penalty: 0.0
          max_tokens: 2048
          stream: true
      vlm_verification:
        system_prompt: |
          You are an expert vision model tasked with answering multiple choice questions
          about images. Analyze the image carefully and select the single best answer from
          the provided options. Respond with ONLY a single letter (A, B, C, or D)
          corresponding to your answer. Do not include any explanation or additional text.
        parameters:
          retry: 0
          temperature: 0.0
          top_p: 1.0
          frequency_penalty: 0.0
          max_tokens: 10
          stream: false