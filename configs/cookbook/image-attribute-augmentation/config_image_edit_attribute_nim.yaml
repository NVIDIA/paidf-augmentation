data:
  - inputs:
      rgb: "/workspace/data/input.png"        # mounted read-only from ./data
    output:
      video: "/workspace/data/out/nim_edit.jpg"         # mounted writable from ./out (data/ is read-only)
      caption: "/workspace/data/out/nim_edit.txt"
      metadata: "/workspace/data/out/nim_edit_metadata.json"

endpoints:
  - id: image_edit_nim
    role: image_edit
    url: "http://localhost:8003"             # host NIM; container uses --network host
    adapter: nim                             # POST /v1/infer (role default is also nim)
    # api_key_env: BUILD_NVIDIA_API_KEY      # uncomment for an authenticated NIM
  - id: vlm_qwen
    role: vlm
    url: "http://localhost:8000/v1"          # local vLLM container, no auth
    model: "Qwen/Qwen3.6-27B-FP8"
  - id: llm_qwen
    role: llm
    url: "http://localhost:8002/v1"          # local vLLM container, no auth
    model: "Qwen/Qwen2.5-14B-Instruct"

pipeline:
  retry: 2
  regenerate_caption_on_retry: false         # static text prompt — nothing to regenerate
  logging:
    enabled: true
    level: "INFO"

captioning:
  llm:
    endpoint_id: llm_qwen
    text: Change the person's clothing to a {top_outer_color} {top_outer_type}, with
      {bottom_color} {bottom_type}, and {shoe_color} {shoe_type}. ALL views of the person's clothing
      and appearance are identical.
    variables:
      bottom_color:
      - black
      bottom_type:
      - jeans
      shoe_color:
      - orange
      shoe_type:
      - sneakers
      top_outer_color:
      - blue
      top_outer_type:
      - sweater
    verification_options:
      bottom_color:
