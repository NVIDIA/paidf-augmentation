# Image Attribute Augmentation edit using HOSTED "nano banana" (Gemini 3 Pro Image) for
# generation instead of the local Qwen-Image-Edit deployment.
#
# BYOM demonstration: swapping the image-edit model is a single endpoints[] entry.
# Gemini 3 Pro Image is served behind a LiteLLM gateway on inference-api.nvidia.com
# that speaks chat.completions and returns the edited image in a `message.images`
# array (NOT message.content) -- the openai.chat.completions adapter handles both
# shapes. Multi-view clothing consistency is excellent on this model.
#
# SECURITY / KEY: the key is NEVER written here. The image-edit endpoint reads it
# from $GEMINI_API_KEY (api_key_env below). Export it before running, e.g.:
#   export GEMINI_API_KEY=sk-...
#   uv run modules/cli.py --config configs/cookbook/image-attribute-augmentation/config_image_edit_attribute_gemini.yaml
# (image_edit's role default is BUILD_NVIDIA_API_KEY; this gateway uses a distinct
# sk-... key, so we name a dedicated var with no surprising fallback.)
#
# The VLM/LLM verifier endpoints below are still LOCAL vLLM (ports 8000/8002).
data:
  - inputs:
      rgb: "/workspace/data/input.png"        # mounted read-only from ./data
    output:
      video: "/workspace/data/out/gemini_edit.jpg"
      caption: "/workspace/data/out/gemini_edit.txt"
      metadata: "/workspace/data/out/gemini_edit_metadata.json"

endpoints:
  - id: image_edit
    role: image_edit
    # base_url is the gateway root -- the OpenAI SDK appends /chat/completions.
    # Do NOT add /v1 here (this gateway serves chat.completions at the root).
    url: "https://inference-api.nvidia.com"
    model: "gcp/google/gemini-3-pro-image-preview"
    adapter: openai.chat.completions    # image returned in message.images[]
    api_key_env: GEMINI_API_KEY    # export this; not the role default
    timeout: 300                        # hosted gen + reasoning; don't cut a healthy run
  - id: vlm
    role: vlm
    url: "http://localhost:8000/v1"     # local vLLM container, no auth
    model: "Qwen/Qwen3-VL-30B-A3B-Instruct-FP8"
  - id: llm
    role: llm
    url: "http://localhost:8002/v1"     # local vLLM container, no auth
    model: "Qwen/Qwen2.5-14B-Instruct"

pipeline:
  retry: 1
  regenerate_caption_on_retry: false    # static text prompt — nothing to regenerate
  logging:
    enabled: true
    level: "INFO"

captioning:
  llm:
    endpoint_id: llm
    text: Change the person's clothing to a {top_outer_color} {top_outer_type}, with
      {bottom_color} {bottom_type}, and {shoe_color} {shoe_type}. Keep the pose, body,
      background, and bags unchanged. ALL views of the person's clothing and appearance
      are identical.
    variables:
      bottom_color:
      - black
      bottom_type:
      - jeans
      shoe_color:
      - orange
      shoe_type:
      - sneakers
      top_outer_color:
      - blue
      top_outer_type:
      - sweater
    verification_options:
      bottom_color:
      - beige
      - black
      - blue
      - brown
      - camouflage
      - green
      - grey
      - orange
      - pink
      - purple
      - red
      - white
      - yellow
      bottom_type:
      - dress
      - leggings
      - jeans
      - shorts
      - skirt
      shoe_color:
      - none
      - beige
      - black
      - blue
      - brown
      - green
      - grey
      - orange
      - pink
      - purple
      - red
      - white
      - yellow
      shoe_type:
      - barefoot
      - boots
      - flip-flops
      - high heels
      - sandals
      - sneakers
      top_outer_color:
      - beige
      - black
      - blue
      - brown
      - camouflage
      - green
      - grey
      - orange
      - pink
      - purple
      - red
      - white
      - yellow
      top_outer_type:
      - camisole
      - knee-length coat
      - hoodie
      - cropped jacket
      - robe
      - sweater
      - vest
    verification_values:
      bottom_color:
      - black
      bottom_type:
      - jeans
      shoe_color:
      - orange
      shoe_type:
      - sneakers
      top_outer_color:
      - blue
      top_outer_type:
      - sweater

augmentation:
  model:
    name: "image-edit"
  parameters:
    # nano banana / Gemini speaks standard chat.completions: the adapter forwards
    # these straight into the request body (top-level), so use flat chat knobs --
    # NOT a Qwen-style extra_body envelope. max_tokens must be generous: the image
    # itself costs ~1100 completion "image_tokens" plus the model's reasoning.
    temperature: 0.7
    max_tokens: 8192

evaluators:
- attribute_verification:
    enabled: true
    exclude_variables:
    - shoe_type
    - shoe_color
    generate_natural_caption_on_pass: true
    natural_caption:
      system_prompt: 'You are an expert at describing images of people. Write a single
        natural sentence describing the person''s appearance and clothing. Be concise
        and factual.

        '
      user_prompt_template: 'This multi-view image shows a person with the following
        clothing: {attributes_text}.

        Write one natural sentence describing the person''s appearance and that it
        is consistent across all views.

        '
    question_generation:
      parameters:
        frequency_penalty: 0.0
        max_tokens: 2048
        presence_penalty: 0.0
        retry: 1
        stream: true
        temperature: 0.2
        top_p: 0.95
      system_prompt: 'You are an expert at creating multiple choice verification questions
        for human attributes.

        The images you analyze always contain a single person with one or multiple
        views of that same person.

        Your task is to generate a simple, direct question that can verify a specific
        attribute about the person.

        The question must have 2-4 answer options and test for a specific visual attribute.

        The question should be answerable by looking at a single view of the person
        even if there are multiple views.

        CRITICAL: Each question MUST explicitly name which clothing/attribute is being
        asked about. Do not use vague wording like "What type of top?" - instead specify
        exactly which attribute, e.g. "outer layer type (shirt, jacket, etc.)", "inner
        layer color", "bottom type (pants/skirt)", "shoe type", "shoe color". This
        avoids ambiguity between inner vs outer layer, top vs bottom, etc.

        CRITICAL: Distractor options must be clearly distinct from the correct answer.
        Do not include visually or semantically overlapping options in the same MCQ.
        For example, if the target/fine-grained color is "olive brown", do not offer
        both "olive" and "brown"; choose one as the correct answer and use clearly
        different colors as distractors. For bottom type, avoid ambiguous pairs like
        "dress" and "skirt" in the same question when one is the correct answer.

        Output your response as a single JSON object with no additional text or formatting.

        '
    vlm_verification:
      parameters:
        frequency_penalty: 0.0
        # The persistent :8000 VLM is a *reasoning* model (Qwen3.x) that emits a
        # chain-of-thought before its answer; give it room so the final A-D letter
        # isn't truncated, and decode greedily for a stable verdict. The answer
        # parser is think-aware (last standalone letter), so CoT is fine.
        max_tokens: 1024
        retry: 5
        stream: false
        temperature: 0.0
        top_p: 1.0
      system_prompt: 'You are an expert vision model tasked with answering multiple
        choice questions about images of humans.

        The images may have one or multiple views of the same person.

        Analyze the image carefully and select the single best answer from the provided
        options.

        Respond with ONLY a single letter (A, B, C, or D) corresponding to your answer.

        Do not include any explanation or additional text.

        '
