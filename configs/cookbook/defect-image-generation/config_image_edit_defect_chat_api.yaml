data:
  - inputs:
      rgb: "/workspace/data/pcb_input.png"
    output:
      video: "/workspace/data/defect/output.jpg"
      caption: "/workspace/data/defect/output.txt"
      metadata: "/workspace/data/defect/metadata.json"

endpoints:
  - id: image_edit
    role: image_edit
    url: "http://localhost:8003/v1"          # vllm-omni serving the finetuned Defect Image Generation model on GPU 5
    model: "nvidia/Qwen-Image-Edit-NVPCB-OVSL2SL"
    adapter: openai.chat.completions  # chat-completions deployment, not NIM

pipeline:
  retry: 1
  regenerate_caption_on_retry: false   # Static text prompt — nothing to regenerate.
  logging:
    enabled: true
    level: "INFO"

captioning:
  llm:
    text: |
      Render this PCB component crop in the style of an NVPCB raked-solder-light
      photograph: dark reddish board with bright orange-red and blue specular
      highlights on the solder pads, photorealistic textures.

augmentation:
  model:
    name: "image-edit"
  parameters:
    # Adapter passes `parameters` straight into the chat request body; Qwen reads
    # diffusion knobs from a top-level `extra_body` object, so nest them here.
    extra_body:
      num_inference_steps: 30
      guidance_scale: 4.0
      seed: 42
      negative_prompt: " "

data_processing:
  alignment:
    # MI-registration: warps the generated image back into the input frame
    # so downstream tools see a pixel-aligned output.
    #
    # DO NOT set sx_range, sy_range, shift_range, or pyr_levels here.
    # They are auto-derived from the generated and reference image dimensions
    # using math equations in modules/data_processing/alignment.py:
    #
    #   sx_range    = [gen_w/ref_w * 0.9, gen_w/ref_w * 1.1, 0.1]
    #   sy_range    = [gen_h/ref_h * 0.9, gen_h/ref_h * 1.1, 0.1]
    #   shift_range = max(ref_h, ref_w) // 4
    #   pyr_levels  = min(3, max levels keeping pyramid floor >= 32 px)
    #
    # Only set them explicitly as a last resort if the alignment output
    # looks visibly wrong (e.g. mi_after far below mi_before of a similar
    # successful run, output looks shifted or scaled incorrectly).

    # Range of rotations (in degrees) to search through.
    # Format: [min, max, step]. The model typically tilts <= 1 degree.
    rot_range_deg: [-1.0, 1.0, 0.1]

    # Pixel resolution of the translation (tx/ty) grid search.
    # 1 = finest and most accurate but slowest; 2-4 are usually fine.
    shift_step: 2

    # Number of histogram bins used to score alignment quality (mutual
    # information). 64 is a good default for 8-bit images.
    bins: 64

    # How pixels are sampled when warping the generated image:
    #   bilinear - smooth interpolation; best for natural photos / RGB
    #   nearest  - exact pixel values; use for masks or label maps
    interp: bilinear

    # If true, do not pre-resize the generated image down to the reference
    # frame; trust the scale search to recover the right ratio.
    # Leave as true for typical use.
    no_resize: true
