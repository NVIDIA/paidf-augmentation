data:
  - inputs:
      rgb: "/workspace/data/sample_input.mp4"   # bundled sample; swap in your own clip (yuv420p / tv-range — see NOTE below)
      controls:
        edge: null      # NIM computes edge/vis controls online from the input (no control files needed)
        depth: null
        seg: null
        vis: null
    output:
      video: "/workspace/data/video/output/output.mp4"
      caption: "/workspace/data/video/output/output.txt"
      metadata: "/workspace/data/video/output/metadata.json"

endpoints:
  - id: vlm_qwen
    role: vlm
    url: "http://localhost:8000/v1"          # local vLLM container, no auth
    model: "Qwen/Qwen3.6-27B-FP8"            # persistent VLM was swapped to Qwen3.6 (verified vision-capable)
  - id: llm_qwen
    role: llm
    url: "http://localhost:8002/v1"          # local vLLM container, no auth
    model: "Qwen/Qwen2.5-14B-Instruct"
  - id: cosmos_transfer
    role: video_transfer
    url: "http://localhost:8008"             # CT2.5 NIM, POST /v1/infer (host 8008 -> container 8000); point at your deployment
    model: ""                                # single-model NIM — omit the 'model' field
    adapter: nim
    timeout: 600

pipeline:
  retry: 0
  regenerate_caption_on_retry: true
  # (no `gpus`: the NIM manages its own GPUs (launched on device=6,7); this
  # pipeline only makes remote /v1/infer calls.)
  logging:
    enabled: true
    level: "INFO"

captioning:
  vlm:
    parser: "instruct"
    system_prompt: |
      You are a helpful assistant that describes video scenes.
      You MUST ONLY describe the scene content itself, never the video quality
      or technical aspects. Respond with plain descriptive text only.
    user_prompt: >
      Describe this traffic intersection surveillance footage.
      Focus on weather conditions, time of day and lighting, road conditions
      and markings, vehicles present, pedestrians, traffic signals, buildings,
      and other physical scene elements. If you cannot see something clearly,
      simply don't mention it. Describe only the scene content.
    parameters:
      temperature: 0.3
      top_p: 0.95
      frequency_penalty: 1.05
      max_tokens: 4096
      stream: false
      fps: 4.0
      max_pixels: 307200

  llm:
    system_prompt: |
      You are an expert at writing concise prompts for a video generation model.
      You are given:
      1. A caption describing the source traffic scene.
      2. Attribute-value pairs describing the desired target conditions.
      Generate a single natural-language prompt that changes the scene to match the
      target attributes while preserving viewpoint, scene layout, vehicle motion,
      and object consistency.
      Output only a JSON object with a single key "prompt" containing the final sentence.
    parameters:
      temperature: 0.3
      top_p: 0.95
      max_tokens: 4096
      frequency_penalty: 1.05
      presence_penalty: 0
      stream: false

    variables:
      weather_condition: ["snow_falling"]
      lighting_condition: ["night"]

augmentation:
  model:
    name: "cosmos-transfer2.5"
    version: "ct2.5"

  parameters:
    # The config constructs the /v1/infer body directly: the NIM adapter forwards
    # `parameters` VERBATIM (nested structure preserved), injects the input video
    # (RAW base64 under "video"), and decodes b64_video. No control structure is
    # hardcoded in the adapter — to change/add a control, just edit here. Knobs
    # below match the reference NIM executor schema (prompt, video, seed,
    # guidance, num_steps, sigma->sigma_max, and per-modality {control_weight}).
    guidance: 7
    seed: 42
    num_steps: 35
    resolution: 720
    sigma_max: 90

    # Controls, nested exactly as they must appear in the body:
    #   edge: {control_weight: 1.0}  ->  body["edge"] = {"control_weight": 1.0}
    # (No control video supplied -> the NIM computes edge/vis online from the
    # input. A control video would be a nested "control" field, which needs the
    # executor to read+encode it — not used for this test.)
    edge:
      control_weight: 1.0

    # Negative prompt IS supported (optional NIM field) — the reference executor
    # just never wired it. Pass-through: this goes straight to
    # body["negative_prompt"] with no code change.
    negative_prompt: >-
      game playing with bad crappy graphics, cartoonish frames, old outdated
      games, fake lighting, raw basic textures, primitive geometry, pixelated
      poor CG quality, subtitles, unrealistic.

    # NOTE: there is NO `positive_prompt` field — `prompt` IS the positive
    # conditioning. Positive style ("cinematic, photorealistic, ...") must be
    # folded into the prompt itself (e.g. via the captioning.llm system_prompt),
    # not sent as a separate field.
    # resolution: 480     # optional: one of 256/480/512/720 (default 720); lower = faster test

evaluators:
  - hallucination_check:
      enabled: true
      # Lowered from 0.682: aggressive day->night + snow transfers legitimately
      # diverge in optical flow, so a heavy style change scores ~0.68. 0.65 keeps
      # the check meaningful while letting valid transfers reach attribute verification.
      threshold: 0.6
      params:
        grad_thresh: 10.0
        blur_ksize: 7
        morph_k: 3
        dist_tol_px: 7.0
        max_frames: null
  - attribute_verification:
      enabled: true
      question_generation:
        system_prompt: |
          You are an expert at creating multiple choice verification questions.
          Your task is to generate a simple, direct question that can verify a
          specific attribute in a video frame. The question must have 2-4 answer
          options and test for a specific visual attribute. The question should be
          answerable by looking at a single frame from the video.
          Output your response as a single JSON object with no additional text or formatting.
        parameters:
          retry: 1
          temperature: 0.2
          top_p: 0.95
          frequency_penalty: 0.0
          presence_penalty: 0.0
          max_tokens: 2048
          stream: true
      vlm_verification:
        system_prompt: |
          You are an expert vision model tasked with answering multiple choice questions
          about images. Analyze the image carefully and select the single best answer from
          the provided options. Respond with ONLY a single letter (A, B, C, or D)
          corresponding to your answer. Do not include any explanation or additional text.
        parameters:
          retry: 0
          temperature: 0.0
          top_p: 1.0
          frequency_penalty: 0.0
          max_tokens: 10
          stream: false
