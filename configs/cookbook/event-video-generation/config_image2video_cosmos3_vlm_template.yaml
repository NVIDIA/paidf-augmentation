data:
  - inputs:
      rgb: "/workspace/data/warehouse_test.png"
      prompt_attributes:
        event_type: "person_falling"
        motion_level: "natural"
        aftermath: "affected_entity_remains_visible"
    output:
      video: "/workspace/data/out/cosmos3_vlm_template/warehouse_fall.mp4"
      caption: "/workspace/data/out/cosmos3_vlm_template/warehouse_fall_prompt.txt"
      metadata: "/workspace/data/out/cosmos3_vlm_template/warehouse_fall_metadata.json"

endpoints:
  # Generic local placeholders. VLM_ENDPOINT_URL / VLM_ENDPOINT_MODEL can
  # override this entry. Do not commit transient deployment addresses.
  - id: vlm_qwen
    role: vlm
    url: "http://localhost:8000/v1"
    model: "Qwen/Qwen3.6-27B-FP8"

  # Used only by attribute verification to generate MCQ questions. Ruben's
  # prompt remains VLM + deterministic template; there is no captioning.llm.
  - id: llm_qwen
    role: llm
    url: "http://localhost:8002/v1"
    model: "Qwen/Qwen2.5-14B-Instruct"

  # Override a colleague's remote deployment at run time, for example:
  # endpoints.2.url=http://HOST:PORT
  - id: cosmos3-image2video
    role: image2video
    url: "http://localhost:8003"
    model: "nvidia/Cosmos3-Super-Image2Video"
    adapter: openai.video.sync
    timeout: 900

pipeline:
  retry: 1
  regenerate_caption_on_retry: false
  logging:
    enabled: true
    level: "INFO"

captioning:
  vlm:
    parser: "instruct"
    system_prompt: |
      You are a vision-language model describing warehouse surveillance images for
      anomaly video augmentation. Describe only what is visible in the seed image.
      Do not invent a new camera, room, workers, or equipment.
    user_prompt: |
      Describe this warehouse seed image in detail for a video-generation prompt writer.
      Describe ONLY what is visible; do not invent anything and do not describe any anomaly yet.
      Include: camera mounting style and viewpoint (state whether wall-mounted or ceiling-mounted
      and whether angled downward), visible warehouse zones, people, vehicles, racks, conveyors,
      pallets, boxes, floor markings, lighting, color palette, occlusions, and empty areas where a
      new event could plausibly happen. Output dense, factual plain-text scene notes.
    parameters:
      retry: 1
      temperature: 0.1
      top_p: 0.9
      frequency_penalty: 0.0
      max_tokens: 2048
      stream: false
      fps: 4.0
      max_pixels: 832000

  template:
    template: |
      {scene_caption}

      Requested event:
      {event_type_text}

      Motion:
      {motion_level_text}

      Aftermath:
      {aftermath_text}

      Preserve the original viewpoint, framing, scene layout, existing people,
      lighting, colors, and fixed objects. No unrelated additions, camera
      movement, cuts, disappearing objects, gore, or overlays.
    attributes:
      event_type:
        person_falling: >
          The existing foreground worker wearing the yellow hard hat and
          fluorescent high-visibility vest walks normally, then one foot catches
          or slides. Across several frames, the torso pitches off balance, the
          arms reach out, the knees bend, and the body drops naturally onto the
          concrete floor in a side-seated or hip-and-hand recovery pose. The fall
          reads gradually, not as an abrupt snap or deliberate kneel.
        forklift_collision: >
          The existing warehouse forklift collides with the nearest visible
          storage rack.
      motion_level:
        natural: >
          Use clear, physically plausible motion with realistic timing.
        pronounced: >
          Make the motion unambiguous while keeping it physically plausible.
      aftermath:
        affected_entity_remains_visible: >
          The affected person or object remains visible in its post-event state
          through the end of the clip.
        scene_stabilizes: >
          The event completes and movement settles without disappearing objects.

augmentation:
  model:
    name: "cosmos3-image2video"
    version: "super"

  parameters:
    size: "1280x720"
    num_frames: 93
    fps: 10
    num_inference_steps: 35
    guidance_scale: 6.0
    flow_shift: 10.0
    seed: 2048
    extra_params:
      use_resolution_template: false
      use_duration_template: false
      guardrails: false

evaluators:
  - attribute_verification:
      enabled: true
      question_generation:
        endpoint_id: llm_qwen
        generate_options: true
        system_prompt: |
          You write ONE simple multiple-choice question that checks whether a
          generated warehouse-anomaly video contains the requested attribute.
          The question must be easy for a VLM to answer from video frames, name
          the attribute explicitly, include the correct value plus 2-3 plausible
          but clearly-wrong distractors you invent, and mark the correct option.
          Output only JSON:
          {"variable","value","question","options":{"A","B",...},"correct_answer"}.
        parameters:
          retry: 1
          temperature: 0.1
          top_p: 0.95
          max_tokens: 1024
          stream: false
      vlm_verification:
        endpoint_id: vlm_qwen
        frames: 6
        system_prompt: |
          You are a strict VLM verifier for generated warehouse-anomaly videos.
          You are shown ordered frames from one clip. Answer each multiple-choice
          question about what is visible across those frames with the single best
          option letter only (A, B, C, or D). Do not explain.
        parameters:
          retry: 1
          temperature: 0.0
          top_p: 1.0
          max_tokens: 32
          stream: false
